name: Validate Sutura
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server/sutura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: .\mvnw.cmd -B test
  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [sutura-app, sutura-agent, merchant-app]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - if: matrix.app == 'sutura-app' || matrix.app == 'merchant-app'
        run: node --test tests/*.test.cjs
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.sutura.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run build
