version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sutura-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sutura}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sutura}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutura-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sutura-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutura-network
    restart: unless-stopped

  sutura-app:
    build:
      context: ./sutura
      dockerfile: Dockerfile
    container_name: sutura-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sutura}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-validate}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SUTURA_EMAIL_API_KEY: ${SUTURA_EMAIL_API_KEY:-}
      MODEMPAY_WEBHOOK_SIGNING_SECRET: ${MODEMPAY_WEBHOOK_SIGNING_SECRET:?MODEMPAY_WEBHOOK_SIGNING_SECRET is required}
      MODEMPAY_API_KEY: ${MODEMPAY_API_KEY:?MODEMPAY_API_KEY is required}
      MODEMPAY_PUBLIC_KEY: ${MODEMPAY_PUBLIC_KEY:-}
      MODEMPAY_API_URL: ${MODEMPAY_API_URL:-https://api.modempay.com}
      SUTURA_SENTINEL_WEBHOOK_SECRET: ${SUTURA_SENTINEL_WEBHOOK_SECRET:?SUTURA_SENTINEL_WEBHOOK_SECRET is required}
      SUTURA_SENTINEL_TENANT_CODE: ${SUTURA_SENTINEL_TENANT_CODE:?SUTURA_SENTINEL_TENANT_CODE is required}
      SUTURA_SENTINEL_BASE_URL: ${SUTURA_SENTINEL_BASE_URL:?SUTURA_SENTINEL_BASE_URL is required}
      SUTURA_SENTINEL_API_KEY: ${SUTURA_SENTINEL_API_KEY:?SUTURA_SENTINEL_API_KEY is required}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sutura-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sutura-network:
    driver: bridge
